name: Publish extension release

on:
  workflow_run:
    workflows: [Test extension]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-extension-release
  cancel-in-progress: false

jobs:
  release:
    # Only successful tests of pushes to this repository's main branch may publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate release version and notes
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = Path('_extensions/open-social-comments/_extension.yml').read_text()
          version = re.search(r'^version: (\d+\.\d+\.\d+)$', metadata, re.M)
          if not version:
              raise SystemExit('A stable semantic version is required')
          version = version.group(1)
          package = json.loads(Path('package.json').read_text())
          if package['version'] != version:
              raise SystemExit('Package and extension versions differ')
          notes = Path(f'docs/releases/v{version}.md')
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG=v{version}\n')
          PY
      - name: Publish versioned release and extension archive
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists without a release; refusing to reuse it."
            exit 1
          fi
          archive="$RUNNER_TEMP/open-social-comments-$RELEASE_TAG.tar.gz"
          git archive --format=tar.gz --prefix="open-social-comments-$RELEASE_TAG/" \
            --output="$archive" HEAD _extensions LICENSE README.md example.qmd
          gh release create "$RELEASE_TAG" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Open Social Comments $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
          echo "created=true" >> "$GITHUB_OUTPUT"
      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.publish.outputs.created == 'true'
        with:
          version: '1.10.18'
      - name: Verify public installation and upgrade
        if: steps.publish.outputs.created == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-fresh" "$RUNNER_TEMP/release-upgrade"
          cd "$RUNNER_TEMP/release-fresh"
          quarto add "$GITHUB_REPOSITORY@$RELEASE_TAG" --no-prompt
          cd "$RUNNER_TEMP/release-upgrade"
          quarto add "$GITHUB_REPOSITORY@v1.0.3" --no-prompt
          quarto update extension "$GITHUB_REPOSITORY@$RELEASE_TAG" --no-prompt
          for project in "$RUNNER_TEMP/release-fresh" "$RUNNER_TEMP/release-upgrade"; do
            cd "$project"
            python3 - <<'PY'
          import os
          from pathlib import Path
          metadata = list(Path('_extensions').rglob('_extension.yml'))
          assert len(metadata) == 1, metadata
          assert f"version: {os.environ['RELEASE_TAG'][1:]}" in metadata[0].read_text()
          assert (metadata[0].parent / 'vendor/purify.min.js').is_file()
          PY
            cp "$GITHUB_WORKSPACE/example.qmd" example.qmd
            quarto render example.qmd --to html
          done
