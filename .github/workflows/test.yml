name: Test extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run vendor
      - run: git diff --exit-code -- _extensions/open-social-comments/vendor
      - run: npm test
      - run: npm run test:filter
      - run: quarto render example.qmd
